services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: xml_pipeline_gradle_db
    environment:
      POSTGRES_USER: xmluser
      POSTGRES_PASSWORD: xmlpass
      POSTGRES_DB: xmlpipeline
    ports:
      - "5434:5432"      # 5434 to avoid conflict with the Maven version (5433)
    volumes:
      - pgdata_gradle:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U xmluser -d xmlpipeline" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Spring Boot Application (localhost:8081 -> app container(port 8080) -> db container (port 5432)
  app:
    build: .
    container_name: xml_pipeline_gradle_app
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: "jdbc:postgresql://db:5432/xmlpipeline"
      DB_USERNAME: xmluser
      DB_PASSWORD: xmlpass
      MAX_CONCURRENT: "20"
      REQUEST_TIMEOUT: "30"
      MAX_RETRIES: "3"
      URLS_FILE: "/app/urls.json"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_gradle: