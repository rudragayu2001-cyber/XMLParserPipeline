plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.xmlpipeline'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ── Spring Boot ──────────────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── Database ─────────────────────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core:11.17.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.17.0'

    // ── XML / Feed parsing (Java equivalent of Python feedparser) ─────────────
    implementation 'com.rometools:rome:2.1.0'

    // ── Structured JSON logging ───────────────────────────────────────────────
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // ── Lombok (compile-time only, excluded from fat JAR) ────────────────────
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── Test ─────────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Exclude Lombok from the executable JAR (it's compile-time only)
//configurations {
//    [apiElements, runtimeElements].each {
//        it.outgoing.artifacts.removeIf {
//            it.buildDependencies.getDependencies(null).contains(jar)
//        }
//    }
//}

tasks.named('test') {
    useJUnitPlatform()
}

// Print JAR location after build for convenience
tasks.named('bootJar') {
    archiveFileName = 'xml-pipeline.jar'
}